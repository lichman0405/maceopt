version: '3.8'

services:
  maceopt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maceopt_service
    ports:
      - "4748:8000"
    volumes:
      - ./output:/app/output
      - ./.env:/app/.env:ro  # Mount .env file as read-only
    environment:
      - DEVICE=auto  # auto/cpu/cuda - automatic GPU detection
      - WORKERS=4
      - MAX_UPLOAD_SIZE_MB=50
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Uncomment below for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
